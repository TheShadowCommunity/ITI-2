<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="flag1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="flag2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="flag3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="flag4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>
    <filter id="blurB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" fill="url(#bgGrad)" />

  <!-- Warm atmospheric campus sun glow -->
  <circle cx="280" cy="140" r="220" fill="url(#sunGlow)" filter="url(#blurB)" />

  <!-- Out-of-focus background trees / stadium silhouettes -->
  <path d="M0,280 Q100,210 220,250 T440,230 T600,260 L600,450 L0,450 Z" fill="#131C2E" opacity="0.8" />
  <path d="M0,320 Q120,270 260,300 T520,280 T600,310 L600,450 L0,450 Z" fill="#0D1420" />

  <!-- Running track / sports ground fence line -->
  <path d="M0,290 C150,285 350,295 600,280" stroke="#CBD5E1" stroke-opacity="0.3" stroke-width="2" fill="none" />
  <path d="M0,305 C150,300 350,310 600,295" stroke="#CBD5E1" stroke-opacity="0.25" stroke-width="2" fill="none" />

  <!-- Fence Posts -->
  <rect x="70" y="260" width="8" height="110" rx="3" fill="#64748B" opacity="0.6" />
  <rect x="230" y="250" width="8" height="120" rx="3" fill="#64748B" opacity="0.6" />
  <rect x="390" y="245" width="8" height="125" rx="3" fill="#64748B" opacity="0.6" />
  <rect x="530" y="240" width="8" height="130" rx="3" fill="#64748B" opacity="0.6" />

  <!-- Colorful triangular festivity & sports bunting / flags string -->
  <path d="M-20,260 Q150,295 300,280 T620,260" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="2.5" fill="none" />
  
  <!-- Flags hanging from string (matches the colorful outdoor sports bunting in Figma PNG) -->
  <!-- Flag 1: Blue -->
  <polygon points="40,268 75,340 100,274" fill="url(#flag1)" />
  <!-- Flag 2: Green -->
  <polygon points="120,277 160,355 190,282" fill="url(#flag2)" />
  <!-- Flag 3: Yellow/Amber -->
  <polygon points="215,283 255,365 285,282" fill="url(#flag3)" />
  <!-- Flag 4: Red -->
  <polygon points="310,281 350,358 380,277" fill="url(#flag4)" />
  <!-- Flag 5: Blue -->
  <polygon points="405,275 440,345 470,270" fill="url(#flag1)" />
  <!-- Flag 6: Green -->
  <polygon points="495,268 530,335 558,264" fill="url(#flag2)" />

  <!-- Subtle trophy / medal accent in background -->
  <g transform="translate(480, 80)" opacity="0.25">
    <circle cx="40" cy="40" r="36" fill="#F2B418" />
    <polygon points="40,15 47,30 63,32 51,43 55,60 40,51 25,60 29,43 17,32 33,30" fill="#1F2A3C" />
  </g>

  <!-- Dark gradient overlay for bottom text contrast -->
  <rect width="600" height="450" fill="url(#cardOverlay)" />
</svg>
