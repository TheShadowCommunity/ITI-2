<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>
  
  <rect width="800" height="600" fill="url(#grad)" />
  <rect width="800" height="600" fill="url(#grid)" />
  
  <!-- Campus / Technical Institute Silhouette Placeholder -->
  <g transform="translate(250, 150)" opacity="0.65">
    <rect x="50" y="80" width="200" height="150" rx="4" fill="#64748B" />
    <polygon points="150,20 40,80 260,80" fill="#475569" />
    <rect x="135" y="150" width="30" height="80" fill="#334155" />
    <!-- Windows -->
    <rect x="75" y="100" width="25" height="30" rx="2" fill="#F8FAFC" />
    <rect x="120" y="100" width="25" height="30" rx="2" fill="#F8FAFC" />
    <rect x="165" y="100" width="25" height="30" rx="2" fill="#F8FAFC" />
    <rect x="200" y="100" width="25" height="30" rx="2" fill="#F8FAFC" />
    <!-- Flag pole -->
    <line x1="150" y1="20" x2="150" y2="0" stroke="#334155" stroke-width="3" />
    <polygon points="150,0 175,10 150,20" fill="#F7B900" />
  </g>

  <!-- Central placeholder label -->
  <g transform="translate(400, 420)">
    <rect x="-180" y="-30" width="360" height="60" rx="8" fill="#202C40" opacity="0.9" />
    <text x="0" y="2" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      LOCAL PLACEHOLDER IMAGE
    </text>
    <text x="0" y="20" fill="#F7B900" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
      Replace via /src/data/assets.ts
    </text>
  </g>
</svg>
