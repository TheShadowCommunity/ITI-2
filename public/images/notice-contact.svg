<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="moodDark" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2D1115" />
      <stop offset="35%" stop-color="#16080A" />
      <stop offset="100%" stop-color="#050203" />
    </radialGradient>
    <radialGradient id="phoneGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="phoneRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="phoneRedDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>
    <linearGradient id="dialBezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>
    <linearGradient id="cardOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.88" />
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Deep dark atmospheric background -->
  <rect width="600" height="450" fill="url(#moodDark)" />

  <!-- Ambient red telephone glow -->
  <circle cx="300" cy="270" r="180" fill="url(#phoneGlow)" filter="url(#softBlur)" />

  <!-- Wooden table shadow -->
  <ellipse cx="300" cy="385" rx="220" ry="35" fill="#000000" opacity="0.9" />

  <!-- Coiled telephone cord on the desk -->
  <path d="M200,320 C170,335 150,350 170,365 C190,380 230,370 210,355 C190,340 180,360 200,375 C215,385 240,385 245,370" stroke="#991B1B" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Phone Base Body (Curved trapezoid / rounded pyramid) -->
  <!-- Base Shadow -->
  <ellipse cx="300" cy="350" rx="110" ry="35" fill="#1C0608" />

  <!-- Main Base -->
  <path d="M220,345 C210,320 235,250 250,230 C265,215 335,215 350,230 C365,250 390,320 380,345 C370,365 230,365 220,345 Z" fill="url(#phoneRedDark)" />
  <path d="M225,340 C218,320 240,255 255,235 C270,222 330,222 345,235 C360,255 382,320 375,340 C365,358 235,358 225,340 Z" fill="url(#phoneRed)" />

  <!-- Specular highlight on base curve -->
  <path d="M255,240 C280,230 320,230 345,240 C330,248 270,248 255,240 Z" fill="#FCA5A5" opacity="0.5" />

  <!-- Chrome/Brass Cradle prongs -->
  <rect x="252" y="195" width="10" height="25" rx="3" fill="#E2E8F0" />
  <rect x="338" y="195" width="10" height="25" rx="3" fill="#E2E8F0" />
  <circle cx="257" cy="195" r="7" fill="#CBD5E1" />
  <circle cx="343" cy="195" r="7" fill="#CBD5E1" />

  <!-- Rotary Dial -->
  <circle cx="300" cy="290" r="42" fill="url(#dialBezel)" />
  <circle cx="300" cy="290" r="38" fill="#F8FAFC" />
  <circle cx="300" cy="290" r="22" fill="#DC2626" />
  <circle cx="300" cy="290" r="14" fill="#991B1B" />
  
  <!-- Dial Number Holes -->
  <g fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5">
    <circle cx="300" cy="258" r="6" />
    <circle cx="320" cy="265" r="6" />
    <circle cx="332" cy="282" r="6" />
    <circle cx="330" cy="303" r="6" />
    <circle cx="316" cy="318" r="6" />
    <circle cx="298" cy="322" r="6" />
    <circle cx="280" cy="314" r="6" />
    <circle cx="269" cy="298" r="6" />
    <circle cx="270" cy="278" r="6" />
    <circle cx="282" cy="264" r="6" />
  </g>

  <!-- Finger Stop Bracket -->
  <path d="M285,324 L295,332 L290,320 Z" fill="#64748B" />

  <!-- Handset resting on top -->
  <!-- Left earpiece/mouthpiece cup -->
  <ellipse cx="230" cy="195" rx="36" ry="24" fill="url(#phoneRedDark)" transform="rotate(-15 230 195)" />
  <ellipse cx="230" cy="195" rx="33" ry="21" fill="url(#phoneRed)" transform="rotate(-15 230 195)" />

  <!-- Right earpiece/mouthpiece cup -->
  <ellipse cx="370" cy="195" rx="36" ry="24" fill="url(#phoneRedDark)" transform="rotate(15 370 195)" />
  <ellipse cx="370" cy="195" rx="33" ry="21" fill="url(#phoneRed)" transform="rotate(15 370 195)" />

  <!-- Handset Handle bar connecting the two cups -->
  <path d="M230,190 C260,170 340,170 370,190 C365,206 335,190 300,190 C265,190 235,206 230,190 Z" fill="url(#phoneRed)" />
  <path d="M245,183 C275,170 325,170 355,183" stroke="#FCA5A5" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Dark gradient overlay for bottom text contrast -->
  <rect width="600" height="450" fill="url(#cardOverlay)" />
</svg>
