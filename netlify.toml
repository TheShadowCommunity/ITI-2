[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/enquiry"
  to = "/.netlify/functions/submit-enquiry"
  status = 200

[[redirects]]
  from = "/api/notices"
  to = "/.netlify/functions/manage-notice"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
